<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect width="40" height="40" rx="8" fill="url(#bgGradient)"/>
  
  <!-- Shield outline (API Contract Protection) -->
  <path d="M20 6 L28 10 L28 18 Q28 24 20 30 Q12 24 12 18 L12 10 Z" 
        fill="none" 
        stroke="url(#shieldGradient)" 
        stroke-width="1.5"
        stroke-linejoin="round"/>
  
  <!-- Inner shield fill -->
  <path d="M20 8 L26 11 L26 17 Q26 22 20 27 Q14 22 14 17 L14 11 Z" 
        fill="url(#shieldGradient)" 
        opacity="0.9"/>
  
  <!-- Checkmark symbol (Contract validation) -->
  <path d="M17 18 L19 20 L23 14" 
        stroke="#6366f1" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>
  
  <!-- API brackets decoration -->
  <path d="M10 14 L11 14 L11 16 L10 16" 
        stroke="#e0e7ff" 
        stroke-width="1.5" 
        stroke-linecap="round"/>
  <path d="M30 14 L29 14 L29 16 L30 16" 
        stroke="#e0e7ff" 
        stroke-width="1.5" 
        stroke-linecap="round"/>
</svg>
